<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英文跟讀練習</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
  h1 { margin: 0; }
  .controls { display: flex; gap: .5rem; margin-left: auto; }
  select { font-size: 1rem; padding: .4rem; max-width: 14rem; }
  #add { display: flex; gap: .5rem; margin-top: 1rem; align-items: flex-start; }
  #add textarea { flex: 1; font-size: 1.25rem; padding: .5rem; font-family: inherit; resize: vertical; }
  #add button { font-size: 1rem; padding: .5rem 1rem; white-space: nowrap; }
  .bar { display: flex; gap: .5rem; margin-top: 1rem; }
  .bar button { font-size: 1rem; padding: .5rem 1rem; cursor: pointer; }
  .bar button:disabled { cursor: default; opacity: .5; }
  #list { list-style: none; padding: 0; margin-top: 1rem; }
  #list li { display: flex; align-items: center; gap: .5rem; padding: .5rem; border-bottom: 1px solid #ddd; }
  #list .text { flex: 1; font-size: 1.1rem; }
  #list button { font-size: 1rem; padding: .3rem .6rem; cursor: pointer; }
  #list .empty { color: #888; justify-content: center; border-bottom: 0; }
  /* outline 不佔空間, 用 border 會讓正在唸的那行把下面整份清單推開 */
  #list li.speaking { outline: 2px solid #06c; outline-offset: -2px; background: #f0f7ff; }
</style>
</head>
<body>

<header>
  <h1>英文跟讀練習</h1>
  <div class="controls">
    <select id="rate" title="播放速度">
      <option value="0.3">0.3x</option>
      <option value="0.5">0.5x</option>
      <option value="0.7">0.7x</option>
      <option value="1" selected>1.0x</option>
      <option value="1.2">1.2x</option>
      <option value="1.5">1.5x</option>
    </select>
    <select id="voice" title="聲音"></select>
  </div>
</header>

<form id="add">
  <textarea id="text" rows="3" autocomplete="off" placeholder="輸入英文句子, 換行分成多句&#10;Ctrl+Enter 新增"></textarea>
  <button>新增</button>
</form>

<div class="bar">
  <button id="playAll">▶ 播放全部</button>
  <button id="del">移除選取</button>
</div>

<ul id="list"></ul>

<!-- 純邏輯: 不碰 DOM, 不碰 localStorage. 開 index.html?selftest 會執行自我檢查 -->
<script id="pure">
// 一行一句: 貼上整段文章可以一次拆成多筆, 空行直接丟掉
const addSentence = (list, text) => [
  ...list,
  ...text.split(/\r?\n/).map(s => s.trim()).filter(Boolean),
];

// 一次移除勾選的那幾句; 刪完勾選一律歸零, 所以不必重算剩下的索引
const removeSelected = (list, sel) => list.filter((_, i) => !sel.includes(i));

const toggleSelection = (sel, i) =>
  sel.includes(i) ? sel.filter(n => n !== i) : [...sel, i];

// 索引的意義依附於清單長度, 兩邊一旦不同步就會指到不存在的項目
const parseSelection = (raw, len) => {
  try {
    const v = JSON.parse(raw);
    return Array.isArray(v)
      ? [...new Set(v)].filter(i => Number.isInteger(i) && i >= 0 && i < len)
      : [];
  } catch {
    return [];
  }
};

// 有勾選就只播勾選的那幾句, 沒有勾選就播全部; 一律依清單順序, 與勾選先後無關
const playQueue = (list, sel) =>
  list.map((_, i) => i).filter(i => !sel.length || sel.includes(i));

// cancel() 仍會對被中斷的那句觸發結束事件, 無條件往下唸就會停不下來.
// 用播放序號判斷這個結束事件屬於哪一輪播放, null 代表這一輪不該再繼續.
const nextInQueue = (queue, pos, eventToken, token) =>
  eventToken !== token || pos + 1 >= queue.length ? null : pos + 1;

// 全部程式碼在同一段 script, 未捕捉的解析錯誤會讓整頁不啟動, 所以損毀就退回空清單
const parseList = raw => {
  try {
    const v = JSON.parse(raw);
    return Array.isArray(v) ? v.filter(s => typeof s === 'string') : [];
  } catch {
    return [];
  }
};

function selfTest() {
  const eq = (actual, expected, msg) => {
    const [a, e] = [JSON.stringify(actual), JSON.stringify(expected)];
    if (a !== e) throw new Error(`${msg}\n  expected ${e}\n  actual   ${a}`);
  };

  eq(addSentence([], '  hi  '), ['hi'], '新增: 去掉頭尾空白');
  eq(addSentence(['a'], 'b'), ['a', 'b'], '新增: 附加到最後');
  eq(addSentence(['a'], '   '), ['a'], '新增: 只有空白就不新增');
  eq(addSentence(['a'], 'a'), ['a', 'a'], '新增: 重複的句子也是獨立一項');
  eq(addSentence([], 'a\nb'), ['a', 'b'], '新增: 換行拆成多筆');
  eq(addSentence([], 'a\r\nb'), ['a', 'b'], '新增: 貼上的 CRLF 也算換行');
  eq(addSentence([], ' a \n\n  \n b '), ['a', 'b'], '新增: 空白行不算一筆');
  eq(addSentence(['x'], '\n\n'), ['x'], '新增: 全是換行就不動清單');

  eq(parseList('["a","b"]'), ['a', 'b'], '還原: 正常 JSON 陣列維持原順序');
  eq(parseList(null), [], '還原: 沒有保存過就是空清單');
  eq(parseList('{oops'), [], '還原: 損毀字串退回空清單');
  eq(parseList('"a"'), [], '還原: 型別不對退回空清單');

  eq(removeSelected(['a', 'b', 'c'], [1]), ['a', 'c'], '移除: 只移除勾選的, 其餘順序不變');
  eq(removeSelected(['a', 'b', 'c'], [0, 2]), ['b'], '移除: 一次移除多句');
  eq(removeSelected(['a', 'b', 'c'], [2, 0]), ['b'], '移除: 與勾選先後無關');
  eq(removeSelected(['a', 'b', 'c'], []), ['a', 'b', 'c'], '移除: 沒勾選就不動清單');
  eq(removeSelected(['a', 'b'], [0, 1]), [], '移除: 全部勾選就清空');

  eq(nextInQueue([0, 1, 2], 0, 5, 5), 1, '續播: 序號沒變就往下一個');
  eq(nextInQueue([0, 1, 2], 1, 5, 5), 2, '續播: 中間往下一個');
  eq(nextInQueue([0, 1, 2], 2, 5, 5), null, '續播: 佇列走完就停');
  eq(nextInQueue([0, 1, 2], 0, 5, 6), null, '續播: 中止後帶著舊序號的結束事件不得續播');

  eq(toggleSelection([0], 2), [0, 2], '切換: 勾選');
  eq(toggleSelection([0, 2], 0), [2], '切換: 取消勾選');

  eq(parseSelection('[0,2]', 3), [0, 2], '還原選取: 範圍內的保留');
  eq(parseSelection('[0,5]', 3), [0], '還原選取: 丟掉超出清單長度的');
  eq(parseSelection('[0,0,1]', 3), [0, 1], '還原選取: 去掉重複');
  eq(parseSelection('nope', 3), [], '還原選取: 損毀字串');
  eq(parseSelection(null, 3), [], '還原選取: 沒有保存過');

  eq(playQueue(['a', 'b', 'c'], []), [0, 1, 2], '佇列: 沒有勾選就是全部');
  eq(playQueue(['a', 'b', 'c'], [1]), [1], '佇列: 有勾選就只有勾選的');
  eq(playQueue(['a', 'b', 'c', 'd'], [1, 3]), [1, 3], '佇列: 可以是多句');
  eq(playQueue(['a', 'b', 'c'], [2, 0]), [0, 2], '佇列: 依清單順序而非勾選順序');
  eq(playQueue([], []), [], '佇列: 空清單');

  return 'selftest ok';
}
</script>

<script>
const synth = speechSynthesis;
const rateSel = document.getElementById('rate');
const voiceSel = document.getElementById('voice');
const listEl = document.getElementById('list');
const form = document.getElementById('add');
const input = document.getElementById('text');
const delBtn = document.getElementById('del');
const playAllBtn = document.getElementById('playAll');

const KEY_LIST = 'sentences';
const KEY_SEL = 'selected';

let list = parseList(localStorage.getItem(KEY_LIST));
let sel = parseSelection(localStorage.getItem(KEY_SEL), list.length);
let token = 0;      // 每次中止或開始依序播放就 +1, 用來認出過期的結束事件
let speakingAt = null; // 正在唸的句子索引, null 代表沒有聲音在跑

// getVoices() 在部分瀏覽器第一次呼叫是空的, 要等 voiceschanged
function loadVoices() {
  const voices = synth.getVoices()
    .filter(v => v.lang.startsWith('en'))
    // 名字含 Natural / Google 的是雲端神經網路語音, 排前面
    .sort((a, b) => score(b) - score(a));
  if (!voices.length) return;
  voiceSel.innerHTML = voices
    .map(v => `<option value="${v.name}">${v.name} (${v.lang})</option>`)
    .join('');
  voiceSel.value = localStorage.getItem('voice') || '';
  if (!voiceSel.value) voiceSel.value = voices[0].name; // 存的音色這台機器沒有
}
const score = v => (/natural|google/i.test(v.name) ? 2 : 0) + (v.lang === 'en-US' ? 1 : 0);

rateSel.value = localStorage.getItem('rate') || '1';
rateSel.onchange = () => localStorage.setItem('rate', rateSel.value);
voiceSel.onchange = () => localStorage.setItem('voice', voiceSel.value);

loadVoices();
synth.onvoiceschanged = loadVoices;

const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);

function render() {
  listEl.innerHTML = list.length
    ? list.map((s, i) => `<li${i === speakingAt ? ' class="speaking"' : ''}>
        <input type="checkbox" data-toggle="${i}" aria-label="選取這一句"${sel.includes(i) ? ' checked' : ''}>
        <span class="text">${esc(s)}</span>
        <button data-play="${i}" title="播放這一句">${i === speakingAt ? '■' : '▶'}</button>
      </li>`).join('')
    : '<li class="empty">還沒有句子, 在上面輸入後按 Ctrl+Enter 新增</li>';
  syncBar();
}

// 播放中只切樣式不重繪: 重建 DOM 會殺掉 checkbox 焦點, 每唸一句整份清單也會閃一下
function highlight() {
  listEl.querySelectorAll('li').forEach((li, i) => {
    li.classList.toggle('speaking', i === speakingAt);
    const btn = li.querySelector('[data-play]'); // 空清單那一行沒有按鈕
    if (btn) btn.textContent = i === speakingAt ? '■' : '▶';
  });
  syncBar();
}

// 勾選會活過重新整理, 所以兩顆按鈕的作用範圍必須寫在自己身上, 不能是隱形狀態
function syncBar() {
  playAllBtn.disabled = !list.length;
  playAllBtn.textContent = speakingAt !== null ? '■ 停止'
    : sel.length ? `▶ 播放選取的 ${sel.length} 句`
    : '▶ 播放全部';
  delBtn.disabled = !sel.length; // 移除只吃勾選, 沒勾就沒有可移除的目標
  delBtn.textContent = sel.length ? `移除選取的 ${sel.length} 句` : '移除選取';
}

function speak(text, onend) {
  const u = new SpeechSynthesisUtterance(text);
  u.voice = synth.getVoices().find(v => v.name === voiceSel.value) || null;
  u.rate = +rateSel.value || 1;
  if (onend) u.onend = onend;
  synth.speak(u);
}

// 中止: 換一個新序號讓還在路上的結束事件失效, 再取消目前的朗讀
function stop() {
  token++;
  speakingAt = null;
  synth.cancel();
}

playAllBtn.onclick = () => {
  if (speakingAt !== null) { stop(); highlight(); return; } // 有聲音在跑, 這顆就是停止
  const queue = playQueue(list, sel); // 按下的當下就固定, 播放中改勾選不影響這一輪
  if (!queue.length) return;
  stop();
  const round = token;
  const step = pos => {
    speakingAt = queue[pos];
    highlight();
    speak(list[queue[pos]], () => {
      const next = nextInQueue(queue, pos, round, token);
      if (next === null) {
        if (round === token) { speakingAt = null; highlight(); } // 自然唸完
        return;
      }
      step(next);
    });
  };
  step(0);
};

// 事件委派: render 每次重建整份清單, 逐項綁事件等於每次重繪都要重綁
listEl.onclick = e => {
  const btn = e.target.closest('[data-play]');
  if (!btn) return;
  const at = +btn.dataset.play;
  if (at === speakingAt) { stop(); highlight(); return; } // 正在唸這句, 再按一次就停
  stop();                 // 避免連點時排隊, 也中止正在進行的依序播放
  const round = token;    // 被中斷的結束事件不該把新的那句取消標示
  speakingAt = at;
  speak(list[at], () => {
    if (round === token) { speakingAt = null; highlight(); }
  });
  highlight();
};

delBtn.onclick = () => {
  // 取消就什麼都不做, 包含不中斷正在進行的朗讀
  if (!confirm(`移除勾選的 ${sel.length} 句?`)) return;
  stop(); // 清單一變動就停止播放, 免得唸到已經不存在的句子
  list = removeSelected(list, sel);
  sel = []; // 勾選的都不在了, 剩下的索引也全部位移, 一律歸零最單純
  commit();
};

function save() {
  localStorage.setItem(KEY_LIST, JSON.stringify(list));
  localStorage.setItem(KEY_SEL, JSON.stringify(sel));
}

// 清單變動的唯一出口: 存檔 + 重繪
function commit() {
  save();
  render();
}

// 勾選只存狀態不重繪: 重繪會重建 checkbox, 鍵盤操作的焦點會跟著不見
listEl.onchange = e => {
  if (e.target.dataset.toggle === undefined) return;
  sel = toggleSelection(sel, +e.target.dataset.toggle);
  save();
  syncBar();
};

// textarea 的 Enter 本來就是換行不會送出; Ctrl/Cmd+Enter 才新增
// 要 preventDefault, 否則送出後那個 Enter 會再插一個換行進已清空的欄位
input.onkeydown = e => {
  if (e.key !== 'Enter' || !(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  form.requestSubmit();
};

form.onsubmit = e => {
  e.preventDefault();
  const next = addSentence(list, input.value);
  form.reset();
  input.focus();
  if (next.length === list.length) return; // 只有空白, 不動清單
  list = next;
  commit();
};

render();

if (location.search.includes('selftest')) console.log(selfTest());
</script>
</body>
</html>
